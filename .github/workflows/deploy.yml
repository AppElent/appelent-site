name: Deploy

# Adapted from developer-home standards/deployments/templates/deploy.yml.
# A merge to main: checks → staging (www-stg.appelent.nl) → smoke check.
# A manual "Run workflow" redeploys main the same way; any other ref fails.
#
# No Convex backend in phase 1, so no deploy key or `convex deploy`.
#
# PHASE 1 (APP-480): there is deliberately NO production job. appelent.nl
# keeps its parked page until the cutover, which adds a `production` job
# (needs: staging, environment: production, main only) together with the
# appelent.nl routes in wrangler.jsonc, `pnpm launch:check` before it ships,
# and Eric's explicit go.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never cancel each other; a newer run queues behind the one in flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Admins can bypass required checks, so check again before shipping.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  staging:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://www-stg.appelent.nl
    permissions: { contents: read }
    env:
      # Scoped to the `staging` GitHub Environment.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The custom domain. Staging has no workers.dev URL to fall back to.
      SMOKE_URL: ${{ vars.SMOKE_URL || 'https://www-stg.appelent.nl' }}
      EXPECTED_WORKER: appelent-www-staging
    defaults:
      run:
        working-directory: apps/www
    steps:
      - name: Guard ref
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Deploys run from main only (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Check environment
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::The staging Environment lacks:$missing. See apps/www/README.md, Staging setup."
            exit 1
          fi

      # version.json records $GITHUB_SHA for the smoke check.
      - run: pnpm build

      # A wrong target would replace another Worker; a production route would
      # take over the live apex.
      - name: Guard Worker name
        run: node scripts/guard-worker.ts staging "$EXPECTED_WORKER"

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --env staging

      - name: Smoke check
        run: node scripts/smoke.ts "$SMOKE_URL" "$GITHUB_SHA"
