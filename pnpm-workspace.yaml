packages:
  - "apps/*"

# pnpm 11 default-denies install/build lifecycle scripts. Only packages that
# compile or download a native binary run theirs.
allowBuilds:
  esbuild: true # native binary (wrangler's bundler)
  workerd: true # downloads the Cloudflare Workers runtime binary
  sharp: false # prebuilt binaries; no install script needed (wrangler, whats-new)

minimumReleaseAge: 4320 # 3 days — blocks the worm/account-takeover window
